name: Deploy Angular Frontend to GitHub Pages

on:
  push:
    branches: [ main ]
    paths:
      - 'frontend/**'
      - '.github/workflows/deploy-frontend.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Install Dependencies
        run: npm ci
        working-directory: frontend

      - name: Build Angular App
        run: npx ng build --configuration production --base-href /TimeKeeper/
        working-directory: frontend

      - name: Copy index.html to 404.html (for Angular Routing)
        run: |
          DIST_DIR=$(find dist -maxdepth 2 -type d -name "browser" -o -name "$(basename $(ls dist))" | tail -n 1)
          cp $DIST_DIR/index.html $DIST_DIR/404.html
        working-directory: frontend

      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: frontend\dist\timekeeper-frontend/browser
          branch: gh-pages